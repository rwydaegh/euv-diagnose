[project]
name = "euv-diagnose"
version = "0.1.0"
description = "EUV reflectometry experiments"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.14", "matplotlib>=3.9", "scikit-learn>=1.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
