[project]
name = "euv-diagnose"
version = "0.1.0"
description = "Reproducible EUV reflectometry inference and calibration diagnostics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
euv-diagnose = "euv_diagnose.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["research/sources", "archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
