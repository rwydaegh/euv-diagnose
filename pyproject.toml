[project]
name = "euv-diagnose"
version = "0.1.0"
description = "Reproducible EUV reflectometry inference and calibration diagnostics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=3.8",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
euv-diagnose = "euv_diagnose.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["research/sources", "archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.uv]
exclude-newer = "2024-09-29T23:59:59Z"

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "euv_diagnose/THIRD_PARTY_NOTICES.md"
